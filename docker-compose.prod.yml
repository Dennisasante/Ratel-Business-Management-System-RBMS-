# Production stack for a single VPS. See DEPLOY.md for the full walkthrough.
#
# All secrets/config come from a `.env` file next to this one (never commit
# it — see .env.production.example for the template). Postgres and the
# backend/frontend talk to each other over the internal `ratel` network by
# service name; only Caddy is exposed to the internet.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ratel_db}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ratel_pg_data:/var/lib/postgresql/data
    networks: [ratel]
    healthcheck:
      # -d is required here — without it, pg_isready checks readiness
      # against a database named after the USER (libpq's own default when
      # no database is given), which doesn't exist, and logs a FATAL error
      # every interval even though Postgres itself is perfectly healthy.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-ratel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Overrides application.yml's default localhost URL — Spring Boot's
      # relaxed env-var binding maps SPRING_DATASOURCE_URL straight onto
      # spring.datasource.url with no code changes needed.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ratel_db}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ratel.app}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      # Generate once with `npx web-push generate-vapid-keys`. VAPID_PUBLIC_KEY
      # also feeds the frontend build below (NEXT_PUBLIC_VAPID_PUBLIC_KEY) —
      # one source value, so the two can never drift out of sync.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Tallia AI. Set AI_PROVIDER=openai explicitly in .env to go live with
      # real OpenAI calls.
      #
      # Defaults to "mock" here (not empty) if .env doesn't set it at all —
      # this is NOT the same as the app's own internal default
      # (application.yml's ${AI_PROVIDER:mock}), which only applies when the
      # property is entirely absent from Spring's environment. Docker
      # Compose's own `${AI_PROVIDER:-}` substitution instead injects an
      # EMPTY STRING into the container when the host-side var is unset —
      # present-but-empty, not absent — and Spring's conditional bean
      # matching (@ConditionalOnProperty on MockAiProvider/OpenAiProvider)
      # does not treat those the same way: neither "mock" nor "openai"
      # matches "", so NEITHER AiProvider bean gets created and the app
      # fails to start at all. Defaulting to "mock" here at the compose
      # layer is what actually makes "safe demo default" true in practice.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # WhatsApp Cloud API (Phase 3B) — platform-level only; each business's
      # own Phone Number ID/access token lives encrypted on its own
      # AiChannelBinding row instead (Super-Admin-configured, see
      # backend/README.md).
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      # Demo-data seeding endpoint — leave unset/false in production.
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      UPLOAD_DIR: /app/uploads
      # Only takes effect if no Super Admin exists yet — safe to leave set
      # after the first run (see DEPLOY.md).
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
    volumes:
      - ratel_uploads:/app/uploads
    networks: [ratel]

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client/server bundle at build time — see
        # frontend/Dockerfile. Must match BACKEND_URL above.
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on: [backend]
    networks: [ratel]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    networks: [ratel]

networks:
  ratel:

volumes:
  ratel_pg_data:
  ratel_uploads:
  caddy_data:
  caddy_config:
