spring:
  application:
    name: rbms

  datasource:
    url: jdbc:postgresql://localhost:5432/ratel_db
    username: ${DB_USERNAME:ratel_user}
    password: ${DB_PASSWORD:ratel_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate should only validate it, never auto-generate it.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB

server:
  port: 8090

app:
  jwt:
    # Override with a long random value via env var in real deployments.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-your-env-vars-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  google:
    # Your OAuth Client ID from Google Cloud Console (see backend README for setup steps).
    # Google ID tokens are only accepted if their "audience" matches this value,
    # so this must be the same Client ID the frontend uses to request sign-in.
    client-id: ${GOOGLE_CLIENT_ID:}
  paystack:
    # From your Paystack dashboard (Settings > API Keys & Webhooks).
    secret-key: ${PAYSTACK_SECRET_KEY:}
    public-key: ${PAYSTACK_PUBLIC_KEY:}
  # Note: ENCRYPTION_KEY (business_integrations' Paystack/WooCommerce secrets,
  # see EncryptedStringConverter) is read directly from the process
  # environment, not resolved through this file — see that class's javadoc
  # for why. Still needs to be set as a real env var, same as JWT_SECRET.
  super-admin:
    # If set (and no super admin exists yet), one is created automatically on
    # startup. Leave unset after the first run — see backend README.
    email: ${SUPER_ADMIN_EMAIL:}
    password: ${SUPER_ADMIN_PASSWORD:}
    full-name: ${SUPER_ADMIN_NAME:Super Admin}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Must be a publicly-reachable URL once deployed — this is where
  # WooCommerce's own servers deliver order webhooks, so localhost only works
  # for logic that doesn't need a live round-trip (e.g. registering the
  # webhook itself, tested against the real WooCommerce API in Stage 2).
  backend-url: ${BACKEND_URL:http://localhost:8090}
  mail:
    from: ${MAIL_FROM:no-reply@ratel.app}
  upload-dir: ${UPLOAD_DIR:./uploads}
  digest:
    # Runs once a day. Default is 6:00 UTC, which is 6:00 AM in Ghana (GMT,
    # no offset) — so the default needs no adjustment for the primary market.
    # If you deploy for businesses elsewhere, override via env var.
    cron: ${DIGEST_CRON:0 0 6 * * *}
  weekly-digest:
    # Runs once a week, Monday mornings — summarizes the just-finished
    # calendar week (last Monday through Sunday) for business Owners and
    # Super Admins alike. Default 7:00 UTC = 7:00 AM in Ghana, same
    # no-offset reasoning as app.digest.cron above.
    cron: ${WEEKLY_DIGEST_CRON:0 0 7 * * MON}
  billing:
    # Runs once a day, shortly after the digest — flips lapsed trials/subscriptions
    # to read-only and sends the 3-day-out renewal reminder.
    expiry-cron: ${BILLING_EXPIRY_CRON:0 30 6 * * *}
  ai:
    # Which AiProvider bean is active — "openai" (real Chat Completions
    # calls, see OpenAiProvider) or "mock" (deterministic demo provider,
    # see MockAiProvider). Defaults to mock so local dev works with zero
    # setup; production deployments must set AI_PROVIDER=openai explicitly
    # in their own env — this default is deliberately NOT "safe-by-coincidence"
    # for production, it's safe because docker-compose.prod.yml/
    # .env.production.example both set it explicitly rather than relying
    # on this fallback.
    provider: ${AI_PROVIDER:mock}
    # Tallia AI (Phase 1) — direct OpenAI Chat Completions calls, see
    # OpenAiProvider. Blank key means the feature is structurally present
    # but unusable, same posture as app.vapid below when unset — never
    # crashes startup, just can't actually answer until configured.
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
  demo:
    # Gates POST /api/platform/demo/seed-resort — off by default everywhere,
    # including production, unless explicitly turned on. This is in ADDITION
    # to that endpoint already being Super-Admin-only like every other
    # /api/platform/** route; two independent gates, neither implied by the
    # other, so a production deploy that forgets to set this stays safe by
    # default rather than safe by coincidence.
    seed-enabled: ${DEMO_SEED_ENABLED:false}
  vapid:
    # Generate once with `npx web-push generate-vapid-keys`. If public/private
    # key are blank, PushNotificationService silently no-ops (same posture as
    # EmailService when SMTP isn't configured) rather than failing startup.
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:support@example.com}
  whatsapp:
    # Tallia AI (Phase 3B) — WhatsApp Cloud API / Meta Graph API. These are
    # PLATFORM-level config (shared by every business's WhatsApp binding);
    # each business's own phone-number-ID/access-token lives encrypted on
    # its own AiChannelBinding row instead (see WhatsAppChannelAdapter) —
    # never a second secret-storage mechanism.
    #
    # The Graph API version string lives here ONLY — never hardcoded in a
    # controller/service — so bumping it later is a one-line config change.
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
    # Arbitrary string you choose yourself and enter into Meta's "Verify
    # Token" field when configuring the webhook — proves the verification
    # GET request actually came from your own Meta App config, not a guess.
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
    # Meta App Secret (App Dashboard > Settings > Basic) — used to verify
    # the X-Hub-Signature-256 HMAC on every inbound webhook POST. Blank
    # means webhook signature verification always fails closed (every
    # inbound event rejected) rather than silently accepting unsigned
    # payloads — same "unusable until configured, never insecure-by-default"
    # posture as every other optional credential in this file.
    app-secret: ${META_APP_SECRET:}
