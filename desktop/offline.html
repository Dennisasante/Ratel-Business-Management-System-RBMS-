<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Tallia — Offline</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: #f5f7fb;
    color: #1a1a1a;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0, 74, 173, 0.12);
    padding: 32px;
    text-align: center;
  }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #fdeaea;
    color: #db1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    margin: 0 auto 18px;
  }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { font-size: 13px; color: #666; line-height: 1.6; margin: 0 0 22px; }
  button {
    padding: 11px 20px;
    border: none;
    border-radius: 8px;
    background: #004aad;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .link {
    display: block;
    margin-top: 16px;
    font-size: 12px;
    color: #999;
    cursor: pointer;
    background: none;
    border: none;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">!</div>
    <h1>Can't reach your Tallia account</h1>
    <p>This computer seems to be offline, or the connection dropped. Check the internet connection and try again — nothing you've already entered has been lost.</p>
    <button id="retry">Try again</button>
    <button class="link" id="change">Change business URL</button>
  </div>
  <script>
    document.getElementById("retry").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "Retrying...";
      await window.ratel.retry();
    });
    document.getElementById("change").addEventListener("click", () => {
      window.ratel.resetConfig();
    });
  </script>
</body>
</html>
